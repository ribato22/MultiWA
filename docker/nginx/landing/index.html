    <meta charset="UTF-8">

    <title data-i18n="api.nginx.title">MultiWA Gateway</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0047ab 0%, #00c6ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .logo {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            backdrop-filter: blur(10px);
        }

        .logo svg {
            width: 64px;
            height: 64px;
            fill: white;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .status {
            background: rgba(255, 255, 255, 0.15);
            padding: 1rem 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            display: inline-block;
            margin-bottom: 2rem;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: white;
            color: #0047ab;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .lang-container {
            margin-top: 1rem;
            margin-bottom: 1rem;
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: .85rem;
            font-weight: 500;
            color: white;
            outline: none;
            cursor: pointer;
            transition: all .2s;
        }

        .lang-select option {
            color: #111827;
        }

        .lang-select:hover, .lang-select:focus {
            background: rgba(255, 255, 255, 0.3);
        }

        /* RTL Overrides */
        html[dir="rtl"] {
            direction: rtl;
        }
        html[dir="rtl"] .status-dot {
            margin-right: 0;
            margin-left: 8px;
        }

        footer {
            margin-top: 2rem;
            opacity: 0.7;
            font-size: 0.9rem;
        }
    </style>
</head>

        const LANGUAGE_STORAGE_KEY = 'multiwa-admin-language';

        function setLanguage(lang) {
            if (!translations[lang]) lang = 'en';
            
            // Save
            try {
                localStorage.setItem(LANGUAGE_STORAGE_KEY, lang);
            } catch (e) {}

            // Update html element dir and lang attributes
            const htmlEl = document.documentElement;
            htmlEl.setAttribute('lang', lang);
            if (lang === 'fa') {
                htmlEl.setAttribute('dir', 'rtl');
            } else {
                htmlEl.setAttribute('dir', 'ltr');
            }

            // Update elements
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                const translation = translations[lang][key];
                if (translation) {
                    el.textContent = translation;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            let activeLang = 'en';
            try {
                const stored = localStorage.getItem(LANGUAGE_STORAGE_KEY);
                if (stored === 'en' || stored === 'fa' || stored === 'id') {
                    activeLang = stored;
                }
            } catch (e) {}

            const select = document.getElementById('lang-select');
            if (select) {
                select.value = activeLang;
                select.addEventListener('change', (e) => {
                    setLanguage(e.target.value);
                });
            }

            setLanguage(activeLang);
        });
    </script>
