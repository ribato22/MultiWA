# MultiWA - publishes the call media port, for answering calls in the dashboard (CALLS_MEDIA_ENABLED=true).
#
# Call media is UDP+TCP straight to the api, never through the HTTP proxy, on the ONE port the media server also
# announces to agents' browsers: it is published on the same number. Add this file after the compose file you run:
#
#   docker compose -f docker-compose.yml -f docker-compose.calls-media.yml up -d
#
# Agents' PCs must reach this port on CALLS_MEDIA_ANNOUNCED_ADDRESS (UDP preferred, TCP as the fallback).
services:
  api:
    ports:
      - "${CALLS_MEDIA_PORT:-40000}:${CALLS_MEDIA_PORT:-40000}/udp"
      - "${CALLS_MEDIA_PORT:-40000}:${CALLS_MEDIA_PORT:-40000}/tcp"
