name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter database exec prisma generate

      - name: Build Database package
        run: pnpm --filter database build

      - name: Build Core package
        run: pnpm --filter core build

      - name: Build Engines package
        run: pnpm --filter engines build

      - name: Build Engine-Runtime package
        run: pnpm --filter engine-runtime build

      - name: Build API
        run: pnpm --filter api build

      - name: Build Worker
        run: pnpm --filter worker build

      - name: Build Admin
        run: pnpm --filter admin build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      # Typecheck gate: `next build` suppresses type errors (ignoreBuildErrors),
      # and nest/tsc builds only typecheck incidentally. Enforce a real
      # `tsc --noEmit` on every app so type regressions fail the PR. Admin runs
      # after its build so the generated .next/types are present.
      - name: Typecheck API
        run: pnpm --filter api typecheck

      - name: Typecheck Worker
        run: pnpm --filter worker typecheck

      - name: Typecheck Admin
        run: pnpm --filter admin typecheck

      # Lint gate (ESLint 9 flat config). Backend TS only (admin uses Next's own
      # eslint). Errors fail the build; stylistic/any rules are warnings for now.
      - name: Lint (ESLint)
        run: pnpm run lint

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - uses: actions/checkout@v4

      - name: Build API Image
        run: docker build -f docker/Dockerfile.api -t multiwa-api:test .

      - name: Build Worker Image
        run: docker build -f docker/Dockerfile.worker -t multiwa-worker:test .

      - name: Build Admin Image
        run: |
          docker build -f docker/Dockerfile.admin \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:3000 \
            -t multiwa-admin:test .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-build
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: multiwa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter database exec prisma generate

      # Build all of the api's workspace dependencies (core, database, engines,
      # engine-runtime) — the e2e suite imports the full AppModule, which resolves
      # these packages by their built dist entry, not just database + engines.
      - name: Build API workspace dependencies
        run: pnpm --filter "api^..." build

      # Coverage gate. Excludes the tenant route-coverage meta-test: it imports
      # every controller to reflect route metadata, which would pull untested
      # controller/service methods into the coverage denominator and skew the
      # number. It runs as its own structural check below.
      - name: Run API tests (with coverage gate)
        run: pnpm --filter api run test:cov
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/multiwa_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-jwt-refresh-secret
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      # Structural IDOR guard: every tenant-scoped route must carry @RequireTenant.
      - name: Tenant route-coverage check
        run: pnpm --filter api run test:meta
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/multiwa_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-jwt-refresh-secret
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      # SDK unit tests (pure — no DB/Redis). Includes the webhook-signature
      # contract test that locks the SDK verifier to the server's HMAC scheme.
      - name: Run SDK tests
        run: pnpm --filter @multiwa/sdk test

      # Create the schema in the test DB (no migrations dir → db push), same mechanism
      # as the Prisma generate step above. Kept out of vitest so it runs in a full shell.
      - name: Prepare e2e database
        run: pnpm --filter database exec prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/multiwa_test

      # Integration (e2e) suite: boots the real NestJS app against the postgres/redis
      # services above and drives HTTP requests through the full pipe/guard/service/
      # Prisma/bcrypt stack — the coverage unit tests mock Prisma and never run the pipe.
      - name: Run API e2e tests
        run: pnpm --filter api run test:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/multiwa_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-jwt-refresh-secret
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          NODE_ENV: test
          ENGINE_HOST: worker
