name: AI Attribution

# Server-side gate for AI authorship credit.
#
# WHY THIS IS NOT REDUNDANT WITH THE COMMIT HOOK
#   .githooks/commit-msg is client-side and opt-in. It cannot see three of the
#   four ways attribution has actually reached this repo:
#     - a commit made with `--no-verify`
#     - a commit authored through the GitHub web UI, where no hook ever runs
#     - the PULL REQUEST BODY, which is not a commit at all
#   The last one is the important one. This repository permits squash merges
#   only, and `squash_merge_commit_message` is set to `PR_BODY`, so GitHub copies
#   the pull request description verbatim into the commit message on `main`.
#   A footer in a PR description therefore becomes git history automatically.
#   That is how it leaked the first time, and no commit hook could have stopped it.
#
# SECURITY NOTE
#   Unlike release-gate.yml, this workflow DOES read user-controlled fields
#   (the pull request title and body). They are NEVER interpolated into a shell
#   script. Each is passed through an `env:` block and written to a file with
#   printf using a quoted variable, so the contents can never be evaluated as
#   shell. Keep it that way — see
#   https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  pull_request:
    branches: [main]
    # `edited` matters: a PR body can be changed to add attribution AFTER the
    # first green run, and the squash message is read at merge time, not at
    # open time. Without this the gate is trivially bypassed.
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-attribution:
    name: No AI attribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          printf '%s\n' "$PR_TITLE" > /tmp/pr-title.txt
          printf '%s\n' "$PR_BODY"  > /tmp/pr-body.txt
          status=0
          bash scripts/check-ai-attribution.sh --label "pull request title" /tmp/pr-title.txt || status=1
          bash scripts/check-ai-attribution.sh --label "pull request body"  /tmp/pr-body.txt  || status=1
          if [ "$status" -ne 0 ]; then
            echo "::error::The pull request title or body contains AI attribution. Because this repo squash-merges using the PR body as the commit message, that text would land in git history on main."
            exit 1
          fi
          echo "PR title and body clean."

      - name: Scan commit messages in this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          if ! git rev-parse --verify --quiet "$BASE_SHA^{commit}" >/dev/null; then
            echo "::warning::base commit not available; skipping commit-message scan."
            exit 0
          fi
          git log --format='%B' "$BASE_SHA..$HEAD_SHA" > /tmp/commit-msgs.txt
          echo "Scanning $(git rev-list --count "$BASE_SHA..$HEAD_SHA") commit message(s)."
          bash scripts/check-ai-attribution.sh --label "commit messages in this PR" /tmp/commit-msgs.txt

      # Backstop. If something reaches main anyway — a web-UI merge, an admin
      # bypass, a force-push — this fails loudly on main so it is caught in
      # hours rather than discovered months later in the contributor list.
      - name: Scan commit messages pushed to main
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          range="$BEFORE_SHA..$AFTER_SHA"
          # A new branch or a force-push can report an all-zero / missing "before".
          if ! git rev-parse --verify --quiet "$BEFORE_SHA^{commit}" >/dev/null; then
            echo "No usable previous SHA; scanning the most recent 50 commits instead."
            range=""
          fi
          if [ -n "$range" ]; then
            git log --format='%B' "$range" > /tmp/pushed-msgs.txt
          else
            git log --format='%B' -n 50 > /tmp/pushed-msgs.txt
          fi
          bash scripts/check-ai-attribution.sh --label "commit messages on this branch" /tmp/pushed-msgs.txt

      - name: Self-test the scanner
        # Proves the gate can actually fail. A scanner that silently matches
        # nothing — a real failure mode noted in scripts/check-public-boundary.sh
        # for long shell alternations — would otherwise report green forever.
        run: |
          set -uo pipefail
          printf 'fix: something\n\nCo-authored-by: Claude <noreply@anthropic.com>\n' > /tmp/neg.txt
          if bash scripts/check-ai-attribution.sh /tmp/neg.txt >/dev/null 2>&1; then
            echo "::error::Negative control PASSED the scanner. The gate is not working."
            exit 1
          fi
          printf 'fix: something\n\nCo-authored-by: Budi <budi@example.com>\n' > /tmp/pos.txt
          if ! bash scripts/check-ai-attribution.sh /tmp/pos.txt >/dev/null 2>&1; then
            echo "::error::A human co-author trailer was rejected. The scanner over-blocks."
            exit 1
          fi
          echo "Scanner self-test passed: blocks AI attribution, allows human co-authors."
