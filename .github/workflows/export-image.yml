name: Export image tarball (air-gapped deploy)

# Builds a service image on a native amd64 runner and uploads it as a downloadable
# .tar.gz artifact, so it can be transferred to an air-gapped host (docker load).
# Used for the wagw deploy path: build here -> download -> scp -> /opt/multiwa/images/.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Which image to build + export
        type: choice
        options: [api, worker, admin]
        default: api
      tag:
        description: Image tag (multiwa-<service>:<tag>)
        default: wagw
      retention-days:
        description: Days GitHub keeps the artifact (1-90). Raise it for a build you deploy, so the next image-delta can use it as OLD.
        type: number
        default: 5

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image (amd64)
        env:
          SERVICE: ${{ inputs.service }}
          TAG: ${{ inputs.tag }}
          # The admin bakes its public API URL into the client bundle at build time. That
          # URL is a deployment detail, so it comes from the repository secret
          # ADMIN_PUBLIC_API_URL (Settings > Secrets and variables > Actions), not from this
          # public file. A secret is also masked in the run log.
          ADMIN_PUBLIC_API_URL: ${{ secrets.ADMIN_PUBLIC_API_URL }}
        run: |
          ARGS=""
          if [ "$SERVICE" = "admin" ]; then
            if [ -z "$ADMIN_PUBLIC_API_URL" ]; then
              echo "::error::Set the repository secret ADMIN_PUBLIC_API_URL (the admin's public API URL, e.g. https://wa.example.com) before exporting the admin image."
              exit 1
            fi
            ARGS="--build-arg NEXT_PUBLIC_API_URL=$ADMIN_PUBLIC_API_URL"
          fi
          docker build -f "docker/Dockerfile.$SERVICE" $ARGS -t "multiwa-$SERVICE:$TAG" .

      - name: Save + gzip
        env:
          SERVICE: ${{ inputs.service }}
          TAG: ${{ inputs.tag }}
        run: |
          docker save "multiwa-$SERVICE:$TAG" | gzip > "multiwa-$SERVICE-$TAG.tar.gz"
          ls -lh "multiwa-$SERVICE-$TAG.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: multiwa-image-${{ inputs.service }}-${{ inputs.tag }}
          path: multiwa-*.tar.gz
          retention-days: ${{ inputs.retention-days }}
