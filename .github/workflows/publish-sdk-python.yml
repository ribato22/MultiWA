name: Publish Python SDK to PyPI

# Publishes the `multiwa` package to PyPI via Trusted Publishing (OIDC) — no
# stored token. Decoupled from the monorepo `v*` tag: push a `sdk-python-v<ver>`
# tag (matching packages/sdk-python/pyproject.toml version) or run manually.
#
# Requires a PyPI Trusted Publisher configured for this repo + this workflow
# filename + the `pypi` environment. The first upload uses PyPI's "pending
# publisher" flow to create the project. See docs/21-releasing-and-distribution.md.

on:
  push:
    tags:
      - 'sdk-python-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build + check
        working-directory: packages/sdk-python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: python-sdk-dist
          path: packages/sdk-python/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC: PyPI Trusted Publishing (no password/token)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-sdk-dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
