name: Publish n8n node to npm

# Publishes n8n-nodes-multiwa to npmjs.org (which is what makes it installable
# via n8n Settings -> Community Nodes and eligible for the verified registry).
# Decoupled tag: push `n8n-v<version>` (matching the package version) or run
# manually.
#
# Keyless: npm Trusted Publishing (npmjs.com -> n8n-nodes-multiwa -> Settings ->
# Trusted Publisher: ribato22/MultiWA, this workflow file, "Allow npm publish").
# The OIDC token authenticates the publish and signs the provenance; there is no
# npm token in this repository.
# See docs/21-releasing-and-distribution.md.

on:
  push:
    tags:
      - 'n8n-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: npm Trusted Publishing + build provenance

jobs:
  publish:
    name: Publish n8n-nodes-multiwa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm (OIDC Trusted Publishing support)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Build node
        run: pnpm --filter n8n-nodes-multiwa build

      - name: Publish
        working-directory: packages/n8n-nodes-multiwa
        run: npm publish --provenance --access public
