name: Publish TS SDK to npm

# Publishes @multiwa/sdk to npmjs.org on a `sdk-v<version>` tag (or manually).
# The version is the release version: every package moves in lockstep (see
# docs/release-checklist.md).
#
# Keyless: npm Trusted Publishing (npmjs.com -> @multiwa/sdk -> Settings ->
# Trusted Publisher: ribato22/MultiWA, this workflow file, "Allow npm publish").
# The OIDC token authenticates the publish and signs the provenance; there is no
# npm token in this repository. See docs/21-releasing-and-distribution.md.

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: npm Trusted Publishing + build provenance

jobs:
  publish:
    name: Publish @multiwa/sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # npm >= 11.5.1 is required for OIDC Trusted Publishing; Node 20 ships npm 10.
      - name: Upgrade npm (OIDC Trusted Publishing support)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @multiwa/sdk build

      - name: Publish
        working-directory: packages/sdk
        run: npm publish --provenance --access public
