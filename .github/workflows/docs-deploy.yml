name: Deploy Docs

# Publishes a combined GitHub Pages site:
#   /        -> the custom landing page (index.html + style.css from repo root)
#   /docs/   -> the Docusaurus documentation site (built from docs-site/)
# Requires the repository Pages source to be set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'index.html'
      - 'style.css'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build Docusaurus (baseUrl /MultiWA/docs/)
        working-directory: docs-site
        run: npx docusaurus build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Assemble combined site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/docs
          # Landing page at the site root
          cp index.html style.css _site/
          # Docusaurus build under /docs
          cp -r docs-site/build/. _site/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
