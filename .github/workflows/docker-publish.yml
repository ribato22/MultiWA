name: Publish Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_NAMESPACE: ribato
  IMAGE_PREFIX: multiwa

permissions:
  contents: read
  packages: write
  id-token: write # OIDC: keyless cosign signing + build-provenance attestation
  attestations: write # actions/attest-build-provenance

jobs:
  publish:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
            build-args: ""
          - service: admin
            dockerfile: docker/Dockerfile.admin
            build-args: NEXT_PUBLIC_API_URL=http://localhost:3333
          - service: worker
            dockerfile: docker/Dockerfile.worker
            build-args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -- Login to GitHub Container Registry --
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- Login to Docker Hub --
      - name: Log in to Docker Hub
        id: docker-hub-login
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != ''
        continue-on-error: true
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # -- Build metadata (tags for both registries) --
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
            ${{ steps.docker-hub-login.outcome == 'success' && format('{0}/{1}-{2}', env.DOCKERHUB_NAMESPACE, env.IMAGE_PREFIX, matrix.service) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # -- Build and push Docker image (with SBOM + max-mode SLSA provenance) --
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.build-args }}
          sbom: true
          provenance: mode=max

      # -- Keyless supply-chain: cosign signature + build-provenance attestation --
      # Both use the workflow's OIDC token (id-token: write) against the public
      # Sigstore Fulcio/Rekor + GitHub's attestation store. No long-lived key.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the GHCR image (keyless)
        env:
          IMAGE: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
