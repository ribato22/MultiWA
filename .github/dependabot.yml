version: 2

# Automated dependency updates. Grouped to avoid PR spam; security updates are
# opened by Dependabot regardless of schedule. This is the mechanism that
# actually burns down the `pnpm audit` high/critical backlog over time.
#
# Both groups are restricted to minor/patch so a group PR always installs +
# builds cleanly. MAJOR bumps arrive as their own individual PRs so each
# breaking upgrade is reviewed on its own — except the framework majors below
# that need a coordinated migration (kept ignored until we do that work).
updates:
  - package-ecosystem: npm # covers the pnpm workspace (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Next.js + React move together: Next 15+ requires React 19, so the admin
      # can only cross either major as one deliberate, tested migration.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Tailwind v4 is a full migration (new engine, CSS-first config, changed
      # class semantics) — not a drop-in bump. tailwind-merge 3.x targets v4, so
      # both stay pinned to the v3 line until we do that migration together.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # vitest and @vitest/coverage-v8 must move together and stay identical across
      # every workspace package, so a vitest major is a single deliberate PR.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # n8n-workflow 2.x is a new n8n node-API major — the published
      # n8n-nodes-multiwa package must be reconciled against it and re-published.
      - dependency-name: "n8n-workflow"
        update-types: ["version-update:semver-major"]
      # lucide-react 1.x renames/removes icons — needs an icon-usage reconciliation.
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native/Go preview) and Node 26 types outrun the pinned
      # runtime (Node 20/22, TS 5.x). Bump these deliberately, not automatically.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
