version: 2

# Automated dependency updates, tuned to keep the review load low.
#
# - Version updates run MONTHLY and arrive as at most two grouped PRs (minor and
#   patch only): one for production and one for development dependencies. A 7-day
#   cooldown skips releases younger than a week, which also keeps freshly published
#   (possibly yanked or compromised) versions out of the batch.
# - MAJOR bumps are never proposed. A major is a deliberate migration done by hand,
#   one at a time (`pnpm --filter <pkg> add <dep>@<version>`), so nothing here opens
#   an individual PR for one. The ones that are known to be coupled are listed below.
# - Security updates do not follow the schedule, the cooldown or the major ignore:
#   they are opened as soon as an advisory has a fix, all in ONE grouped PR per
#   ecosystem. This needs "Dependabot alerts" and "Dependabot security updates"
#   enabled in the repository settings. It is the mechanism that burns down the
#   `pnpm audit` high/critical backlog.
#
# Majors that must be migrated together (do each as one PR, then drop it from this list):
#   - react + react-dom (+ @types/react, @types/react-dom): React 19 is a deliberate
#     migration. Next 15 itself runs on React 18 for this app (verified in #237), so the
#     two no longer have to move together.
#   - tailwindcss + tailwind-merge: Tailwind v4 is a full migration (new engine,
#     CSS-first config, changed class semantics); tailwind-merge 3.x targets v4.
#   - vitest + @vitest/coverage-v8: must move together and stay identical across
#     every workspace package.
#   - n8n-workflow 2.x: a new n8n node-API major; the published n8n-nodes-multiwa
#     package must be reconciled against it and re-published.
#   - lucide-react 1.x: renames/removes icons, needs an icon-usage reconciliation.
#   - the NestJS family (@nestjs/*): one framework, one coordinated migration.
#     Bumping one package alone pairs mismatched majors and the app cannot even
#     load (Nest 12 PRs #177-#184 were each individually unbuildable).
#   - typescript 7 and @types/node 26: they outrun the pinned runtime (Node 20/22,
#     TS 5.x).
updates:
  - package-ecosystem: npm # covers the pnpm workspace (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # fastify can NEVER be bumped on its own: @nestjs/platform-fastify declares an
      # EXACT fastify dependency (11.1.28 -> 5.10.0, 11.1.29 -> 5.11.0). A standalone
      # bump therefore resolves a SECOND fastify copy, and the plugin typings
      # (@fastify/multipart, @fastify/helmet) bind to the other one — app.factory.ts
      # then fails with TS2345 (this is exactly why PR #153 could not build). The pair
      # moves together in a hand-made PR; a fastify-only security patch is unusable
      # until Nest ships a matching platform-fastify anyway.
      - dependency-name: "fastify"
      # pnpm.patchedDependencies: the patch file is named after the exact version
      # (patches/bullmq@6.1.1.patch), so a bump needs the patch re-based by hand.
      # Dependabot cannot do that and fails the whole update job with
      # dependency_file_not_resolvable ("Error while updating bullmq in update group
      # patchedDependencies"). Bump these two in a hand-made PR together with the patch.
      - dependency-name: "bullmq"
      - dependency-name: "whatsapp-web.js"

  # The docs site is a separate npm project with its own package-lock.json. Version
  # updates are off (limit 0); security updates still arrive, grouped into ONE PR.
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
