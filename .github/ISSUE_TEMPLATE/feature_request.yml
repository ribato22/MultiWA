name: ✨ Feature request
description: Suggest an idea or improvement for MultiWA
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please search [existing issues](https://github.com/ribato22/MultiWA/issues?q=is%3Aissue) and [Discussions](https://github.com/ribato22/MultiWA/discussions) first — broad ideas are often better as a Discussion.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues/discussions and this is not a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What's the use case? ("I'm frustrated when …")
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Include API shape / UI sketch if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - API (apps/api)
        - Worker (apps/worker)
        - Admin dashboard (apps/admin)
        - Engine adapter (packages/engines)
        - SDK (TypeScript / Python / PHP)
        - Webhooks / integrations
        - Automation / AI
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — screenshots, references, willingness to contribute a PR.
