version: "3.8"

# MultiWA Production Stack
# Usage: docker compose -f docker-compose.production.yml up -d
# Ensure .env.production exists alongside this file

# Shared log-rotation policy. Without a cap, container json-file logs grow
# unbounded and can fill the host disk (this has caused a real production
# outage: full disk -> Postgres crash-loop). Applied to every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER:-multiwa}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-multiwa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-multiwa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Cache / Queue ──────────────────────────────
  # This Redis backs BullMQ (durable webhook + message delivery). BullMQ REQUIRES
  # an eviction policy of `noeviction` — under memory pressure any other policy
  # silently evicts queued jobs, dropping webhooks/messages with no error. AOF is
  # enabled so queued jobs survive a restart. maxmemory sized with headroom so the
  # queue does not hit the limit under normal load; alert before it does.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Object Storage ─────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  # ─── API Server ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    # tini as PID 1: node here registers SIGTRAP/SEGV handlers (puppeteer), so as
    # PID 1 a fatal V8 abort spins at 100% CPU instead of exiting and `restart`
    # never fires. With an init process the crash exits and the container restarts.
    init: true
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-multiwa}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-multiwa}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Must match the API upstream port in docker/nginx/nginx.conf (api:3333).
      API_PORT: 3333
      API_HOST: 0.0.0.0
      # Only nginx reaches the API, from this file's Docker network.
      TRUST_PROXY: ${TRUST_PROXY:-172.16.0.0/12}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_URL: ${ADMIN_URL:-https://wa.yourdomain.com}
      S3_ENDPOINT: http://minio:9000
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-multiwa}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Where the WhatsApp engines run. The api and the worker must agree: with 'worker' the api hands its engine work
      # to the worker, and must not open the sessions itself (each profile would run twice, on the same sessions volume).
      ENGINE_HOST: ${ENGINE_HOST:-api}
      WHATSAPP_ENGINE: ${WHATSAPP_ENGINE:-whatsapp-web.js}
      CHROMIUM_PATH: /usr/bin/chromium
      # WhatsApp sessions are written under SESSIONS_DIR (see engine-manager +
      # whatsapp-web.js LocalAuth dataPath). Must match the volume mount below,
      # or logins are lost on every container recreate.
      SESSIONS_DIR: /data/sessions
      # Webhook retry policy (read by BOTH dispatchers — apps/api and apps/worker).
      # Defaults preserve the historical 5 attempts x 30s exponential backoff.
      WEBHOOK_RETRY_ATTEMPTS: ${WEBHOOK_RETRY_ATTEMPTS:-5}
      WEBHOOK_RETRY_DELAY_MS: ${WEBHOOK_RETRY_DELAY_MS:-30000}
      SEND_TIMEOUT_MS: ${SEND_TIMEOUT_MS:-60000}
      WWEBJS_MEMORY_LIMIT_MB: ${WWEBJS_MEMORY_LIMIT_MB:-2500}
      # Calls answered in the dashboard (phase 2): off by default. Media is UDP+TCP straight to the api, never through
      # the HTTP proxy: switched on, add docker-compose.calls-media.yml, which publishes the media port.
      CALLS_MEDIA_ENABLED: ${CALLS_MEDIA_ENABLED:-false}
      CALLS_MEDIA_PORT: ${CALLS_MEDIA_PORT:-40000}
      CALLS_MEDIA_ANNOUNCED_ADDRESS: ${CALLS_MEDIA_ANNOUNCED_ADDRESS:-}
      CALLS_MEDIA_LISTEN_IP: ${CALLS_MEDIA_LISTEN_IP:-}
      CALLS_MEDIA_ICE_SERVERS: ${CALLS_MEDIA_ICE_SERVERS:-}
      CALLS_MAX_TALK_MINUTES: ${CALLS_MAX_TALK_MINUTES:-120}
      # Recordings of the calls answered in the dashboard: private, on a volume of their own (never the sessions volume,
      # whose snapshots would carry every recording). For S3 instead: CALL_RECORDINGS_STORAGE=s3 with the S3_* settings.
      CALL_RECORDINGS_STORAGE: ${CALL_RECORDINGS_STORAGE:-}
      CALL_RECORDINGS_PATH: ${CALL_RECORDINGS_PATH:-/data/call-recordings}
      CALL_RECORDINGS_BUCKET: ${CALL_RECORDINGS_BUCKET:-}
      CALL_RECORDINGS_PREFIX: ${CALL_RECORDINGS_PREFIX:-}
      CALL_RECORDINGS_SSE: ${CALL_RECORDINGS_SSE:-}
      # Recordings in progress, on a volume of their own too: a restart in the middle of a call leaves its recording
      # to be stored (partial) at the next start.
      CALL_RECORDINGS_TMP: ${CALL_RECORDINGS_TMP:-/data/call-recordings-tmp}
    volumes:
      - wa_sessions:/data/sessions
      - call_recordings:/data/call-recordings
      - call_recordings_tmp:/data/call-recordings-tmp
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3333/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal

  # ─── Background Worker (BullMQ) ─────────────────
  # Drains durable webhook delivery + background jobs. Without this the queues
  # fill and webhooks are never delivered. Shares the API's sessions volume so a
  # future ENGINE_HOST=worker cut-over can host the engine here; with the default
  # ENGINE_HOST=api it only processes queues.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    init: true  # see the api service
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-multiwa}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-multiwa}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ENGINE_HOST: ${ENGINE_HOST:-api}
      WHATSAPP_ENGINE: ${WHATSAPP_ENGINE:-whatsapp-web.js}
      DEFAULT_ENGINE: ${WHATSAPP_ENGINE:-whatsapp-web.js}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      SESSIONS_DIR: /data/sessions
      S3_ENDPOINT: http://minio:9000
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-multiwa}
      S3_REGION: ${S3_REGION:-us-east-1}
      WEBHOOK_LOG_PAYLOAD_MAX_BYTES: ${WEBHOOK_LOG_PAYLOAD_MAX_BYTES:-512}
      # Webhook retry policy (read by BOTH dispatchers — apps/api and apps/worker).
      # Defaults preserve the historical 5 attempts x 30s exponential backoff.
      WEBHOOK_RETRY_ATTEMPTS: ${WEBHOOK_RETRY_ATTEMPTS:-5}
      WEBHOOK_RETRY_DELAY_MS: ${WEBHOOK_RETRY_DELAY_MS:-30000}
      SEND_TIMEOUT_MS: ${SEND_TIMEOUT_MS:-60000}
      WWEBJS_MEMORY_LIMIT_MB: ${WWEBJS_MEMORY_LIMIT_MB:-2500}
      # Per-attempt webhook delivery timeout (read by apps/worker's webhook processor).
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-30000}
    volumes:
      - wa_sessions:/data/sessions
    networks:
      - internal

  # ─── Admin Dashboard ────────────────────────────
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.yourdomain.com}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.yourdomain.com}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  # ─── Reverse Proxy ──────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_started
      admin:
        condition: service_started
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  minio_data:
  wa_sessions:
  call_recordings:
  call_recordings_tmp:

networks:
  internal:
    driver: bridge
