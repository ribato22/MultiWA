version: "3.8"

# MultiWA Production Stack
# Usage: docker compose -f docker-compose.production.yml up -d
# Ensure .env.production exists alongside this file

# Shared log-rotation policy. Without a cap, container json-file logs grow
# unbounded and can fill the host disk (this has caused a real production
# outage: full disk -> Postgres crash-loop). Applied to every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER:-multiwa}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-multiwa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-multiwa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Cache / Queue ──────────────────────────────
  # This Redis backs BullMQ (durable webhook + message delivery). BullMQ REQUIRES
  # an eviction policy of `noeviction` — under memory pressure any other policy
  # silently evicts queued jobs, dropping webhooks/messages with no error. AOF is
  # enabled so queued jobs survive a restart. maxmemory sized with headroom so the
  # queue does not hit the limit under normal load; alert before it does.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Object Storage ─────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  # ─── API Server ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-multiwa}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-multiwa}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Must match the API upstream port in docker/nginx/nginx.conf (api:3333).
      API_PORT: 3333
      API_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_URL: ${ADMIN_URL:-https://wa.yourdomain.com}
      S3_ENDPOINT: http://minio:9000
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-multiwa}
      S3_REGION: ${S3_REGION:-us-east-1}
      WHATSAPP_ENGINE: ${WHATSAPP_ENGINE:-whatsapp-web.js}
      CHROMIUM_PATH: /usr/bin/chromium
      # WhatsApp sessions are written under SESSIONS_DIR (see engine-manager +
      # whatsapp-web.js LocalAuth dataPath). Must match the volume mount below,
      # or logins are lost on every container recreate.
      SESSIONS_DIR: /data/sessions
    volumes:
      - wa_sessions:/data/sessions
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3333/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal

  # ─── Background Worker (BullMQ) ─────────────────
  # Drains durable webhook delivery + background jobs. Without this the queues
  # fill and webhooks are never delivered. Shares the API's sessions volume so a
  # future ENGINE_HOST=worker cut-over can host the engine here; with the default
  # ENGINE_HOST=api it only processes queues.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-multiwa}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-multiwa}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ENGINE_HOST: ${ENGINE_HOST:-api}
      WHATSAPP_ENGINE: ${WHATSAPP_ENGINE:-whatsapp-web.js}
      DEFAULT_ENGINE: ${WHATSAPP_ENGINE:-whatsapp-web.js}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      SESSIONS_DIR: /data/sessions
      S3_ENDPOINT: http://minio:9000
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-multiwa}
      S3_REGION: ${S3_REGION:-us-east-1}
      WEBHOOK_LOG_PAYLOAD_MAX_BYTES: ${WEBHOOK_LOG_PAYLOAD_MAX_BYTES:-512}
    volumes:
      - wa_sessions:/data/sessions
    networks:
      - internal

  # ─── Admin Dashboard ────────────────────────────
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.yourdomain.com}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.yourdomain.com}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  # ─── Reverse Proxy ──────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_started
      admin:
        condition: service_started
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  minio_data:
  wa_sessions:

networks:
  internal:
    driver: bridge
